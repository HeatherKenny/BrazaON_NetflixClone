<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrazaON - Resultados da Busca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <div class="container mt-5">
        <h2 class="mb-4" th:text="'Resultados para: ' + ${searchQuery}"></h2>
        
        <div th:if="${results.empty}" class="text-center py-5">
            <i class="bi bi-search fs-1 text-muted"></i>
            <p class="mt-3 lead">Puxa, não encontramos nada com esse nome por aqui.</p>
        </div>

        <div class="row g-4">
            <div th:each="item : ${results}" class="col-6 col-md-3 col-lg-2 mb-4">
                <div class="card h-100 shadow-sm border-0">
                    <img th:src="${item.poster_path != null ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=Sem+Poster'}" 
                         class="card-img-top" th:alt="${item.getDisplayName()}">
                    <div class="card-body p-2 text-center">
                        <h6 class="card-title text-truncate mb-1" th:text="${item.getDisplayName()}"></h6>
                        <div class="d-flex justify-content-center align-items-center gap-2">
                            <span class="badge bg-warning" th:text="${item.getDisplayRating()}"></span>
                            <small class="text-muted" th:text="${item.getDisplayDate()}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{index :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
