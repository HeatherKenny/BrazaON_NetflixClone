<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'BrazaON - ' + ${tipo}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <div class="container mt-5">
        <h1 class="mb-5 text-center" th:text="'Catálogo de ' + ${tipo} + ' Brasileiros'"></h1>

        <section class="mb-5">
            <h3 class="mb-4"><i class="bi bi-trophy-fill text-warning"></i> Top 10</h3>
            <div class="row g-4 flex-nowrap overflow-auto pb-3">
                <div th:each="item : ${top10}" class="col-6 col-md-4 col-lg-2">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${item.poster_path != null ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=Sem+Poster'}" class="card-img-top" th:alt="${item.getDisplayName()}">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" th:text="${item.getDisplayName()}"></h6>
                            <span class="badge bg-warning" th:text="${item.getDisplayRating()}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-5">
            <h3 class="mb-4"><i class="bi bi-star-fill text-primary"></i> Premiados</h3>
            <div class="row g-4">
                <div th:each="item : ${premiados}" class="col-6 col-md-3 col-lg-2">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${item.poster_path != null ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=Sem+Poster'}" class="card-img-top" th:alt="${item.getDisplayName()}">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" th:text="${item.getDisplayName()}"></h6>
                            <small class="text-muted" th:text="${item.getDisplayDate()}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-5">
            <h3 class="mb-4"><i class="bi bi-clock-fill text-success"></i> Lançamentos em filmes e series</h3>
            <div class="row g-4">
                <div th:each="item : ${recem}" class="col-6 col-md-3 col-lg-2">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="${item.poster_path != null ? 'https://image.tmdb.org/t/p/w500' + item.poster_path : 'https://via.placeholder.com/500x750?text=Sem+Poster'}" class="card-img-top" th:alt="${item.getDisplayName()}">
                        <div class="card-body p-2 text-center">
                            <h6 class="card-title text-truncate mb-1" th:text="${item.getDisplayName()}"></h6>
                            <small class="text-muted" th:text="${item.getDisplayDate()}"></small>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <footer th:replace="~{index :: footer}"></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
