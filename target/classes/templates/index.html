<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BrazaON - V1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="~{fragments/menu :: menu}"></div>

    <div class="container mt-5">
        <h1>Bem-vindo ao BrazaON</h1>
        <p>Aqui temos a V1, agora com o menu de navegação funcionando.</p>

        <div th:if="${movies.empty}" class="alert alert-info mt-4">
            <strong>Aviso:</strong> Nenhum filme encontrado. Verifique se a sua chave da API do TMDb foi configurada no <code>TmdbService.java</code>.
        </div>
        
        <div class="row mt-4">
            <div th:each="movie : ${movies}" class="col-md-3 mb-4">
                <div class="card">
                    <img th:src="${movie.poster_path != null ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : 'https://via.placeholder.com/500x750?text=Sem+Poster'}" class="card-img-top" th:alt="${movie.title}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${movie.title}"></h5>
                        <p class="card-text text-truncate" th:text="${movie.overview}"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
